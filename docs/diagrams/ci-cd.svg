  <rect x="1060" y="310" width="230" height="80" rx="8" ry="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2" opacity="1" />
  <rect x="1420" y="150" width="260" height="80" rx="8" ry="8" fill="#dee2e6" stroke="#495057" stroke-width="2" opacity="1" />
