  </defs>
  <rect x="0" y="-20" width="1720" height="780" fill="#ffffff" />
  <rect x="360" y="110" width="970" height="480" rx="8" ry="8" fill="#f8f9fa" stroke="#495057" stroke-width="2" opacity="0.6" stroke-dasharray="8 4" />
  <rect x="40" y="150" width="240" height="80" rx="8" ry="8" fill="#ffec99" stroke="#f08c00" stroke-width="2" opacity="1" />
